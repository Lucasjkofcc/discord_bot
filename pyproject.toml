[project]
name = "discord-integration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lucasjkofcc", email = "brawllucas15@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "feedparser>=6.0.14",
    "mss>=10.2.0",
    "ollama>=0.6.3",
    "pyinstaller>=6.22.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
discord-integration = "discord_integration:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
